services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: financial_ai_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: financial_ai_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: financial_ai_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
